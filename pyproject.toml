[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous_repo_engineer"
version = "0.1.0"
description = "Autonomous GitHub repository analysis and fix generation agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["autonomous_repo_engineer"]

[tool.setuptools.package-data]
autonomous_repo_engineer = []

[tool.pytest.ini_options]
testpaths = ["tests"]
